<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지식 베이스</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/autoloader/prism-autoloader.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.10.8/dist/index.css" />
  <script src="https://cdn.jsdelivr.net/npm/vditor@3.10.8/dist/index.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top chrome -->
  <header id="topbar">
    <div class="top-left">
      <button class="icon-btn" id="sidebar-toggle" title="사이드바">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <button class="logo-mark" id="logo-home" title="홈">&#x77E5;</button>
    </div>
    <nav class="top-tabs">
      <button class="tab" data-view="library">라이브러리</button>
      <button class="tab" data-view="graph">그래프</button>
      <button class="tab" data-view="journal">저널</button>
    </nav>
    <div class="top-right">
      <button class="icon-btn" id="search-toggle" title="검색 (/)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="icon-btn" id="surprise-btn" title="랜덤">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><circle cx="16" cy="8" r="1.5" fill="currentColor"/><circle cx="8" cy="16" r="1.5" fill="currentColor"/><circle cx="16" cy="16" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="deploy-btn" title="미러 배포 준비">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
    </div>
  </header>

  <!-- Left sidebar (collapsible) -->
  <aside id="left-sidebar" class="sidebar-closed">
    <div class="sb-header">
      <div class="sb-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="sb-search-input" placeholder="검색..." />
      </div>
    </div>
    <div class="sb-sections">
      <div class="sb-section">
        <div class="sb-section-title">개념</div>
        <div id="sb-concepts" class="sb-list"></div>
      </div>
      <div class="sb-section">
        <div class="sb-section-title">글</div>
        <div id="sb-posts" class="sb-list"></div>
      </div>
    </div>
  </aside>
  <div id="sidebar-backdrop" class="backdrop hidden"></div>

  <!-- Search overlay -->
  <div id="search-overlay" class="overlay hidden">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="global-search" placeholder="무엇이든 검색..." autofocus />
    </div>
    <div id="search-results"></div>
  </div>

  <!-- Domain filter strip -->
  <div id="domain-strip">
    <button class="domain-pill active" data-domain="all">전체</button>
    <button class="domain-pill" data-domain="ai" style="--domain-color:#6251b5"><span class="dot"></span>AI</button>
    <button class="domain-pill" data-domain="dev" style="--domain-color:#2878a9"><span class="dot"></span>개발 &amp; CS</button>
    <button class="domain-pill" data-domain="accounting" style="--domain-color:#2d855f"><span class="dot"></span>회계</button>
    <button class="domain-pill" data-domain="economics" style="--domain-color:#c75b39"><span class="dot"></span>경제 &amp; 통계</button>
    <button class="domain-pill" data-domain="design" style="--domain-color:#b83f7d"><span class="dot"></span>디자인</button>
    <button class="domain-pill" data-domain="startup" style="--domain-color:#b7791f"><span class="dot"></span>창업</button>
    <button class="domain-pill" data-domain="english" style="--domain-color:#16858b"><span class="dot"></span>영어</button>
    <button class="domain-pill" data-domain="other" style="--domain-color:#78716c"><span class="dot"></span>기타</button>
  </div>

  <!-- Main -->
  <main id="main">

    <!-- HOME -->
    <section id="view-home" class="view active">
      <h1 class="page-title serif" id="greeting"></h1>
      <p class="page-sub" id="greeting-sub"></p>

      <div class="home-section">
        <h2 class="section-title">도메인</h2>
        <div id="domain-overview" class="domain-cards"></div>
      </div>

      <div class="home-section">
        <h2 class="section-title">최근</h2>
        <div id="recent-items"></div>
      </div>

      <div class="home-section">
        <div class="section-title-row">
          <h2 class="section-title">최근 글</h2>
          <button class="link-btn" data-view="journal">전체 보기</button>
        </div>
        <div id="latest-posts"></div>
      </div>

      <div class="stats-footer" id="stats"></div>
    </section>

    <!-- LIBRARY -->
    <section id="view-library" class="view">
      <div class="view-top-row">
        <h1 class="page-title serif">라이브러리</h1>
        <input type="text" id="library-filter" class="filter-input" placeholder="필터..." />
      </div>
      <div id="library-list" class="card-list"></div>
    </section>

    <!-- GRAPH -->
    <section id="view-graph" class="view">
      <h1 class="page-title serif">지식 그래프</h1>
      <div id="graph-container"></div>
      <div id="graph-legend" class="graph-legend"></div>
    </section>

    <!-- JOURNAL -->
    <section id="view-journal" class="view">
      <h1 class="page-title serif">저널</h1>
      <div id="journal-list"></div>
    </section>

    <!-- DETAIL -->
    <section id="view-detail" class="view">
      <button id="back-btn" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        돌아가기
      </button>
      <article id="detail-content" class="reading"></article>
      <div id="memo-popover" class="memo-popover hidden" role="toolbar">
        <button id="memo-popover-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3H5a2 2 0 0 0-2 2v14l4-4h9a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Z"/></svg>
          메모
        </button>
      </div>
      <aside id="memo-panel" class="memo-closed" aria-label="메모 패널">
        <div class="memo-head">
          <span class="memo-title">메모</span>
          <button class="icon-btn" id="memo-close" title="닫기" aria-label="메모 패널 닫기">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="memo-composer">
          <div class="memo-types" role="radiogroup" aria-label="메모 유형">
            <button class="memo-type active" data-type="insight" role="radio" aria-checked="true" title="통찰" aria-label="통찰">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8.5 14.5A6 6 0 1 1 15.5 14.5C14.5 15.3 14 16.1 14 18h-4c0-1.9-.5-2.7-1.5-3.5Z"/></svg>
            </button>
            <button class="memo-type" data-type="question" role="radio" aria-checked="false" title="질문" aria-label="질문">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 1 1 5.6 1.5c-.9 1.1-2.7 1.5-2.7 3.5"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            </button>
            <button class="memo-type" data-type="link" role="radio" aria-checked="false" title="연결" aria-label="연결">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
            </button>
            <button class="memo-type" data-type="todo" role="radio" aria-checked="false" title="할일" aria-label="할일">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </button>
          </div>
          <div id="memo-quote" class="memo-quote hidden"></div>
          <textarea id="memo-input" rows="3" placeholder="생각을 남기세요..." aria-label="메모 내용"></textarea>
          <button id="memo-save" class="memo-save-btn">추가</button>
        </div>
        <div id="memo-list" class="memo-list"></div>
      </aside>
      <div id="detail-related" class="related"></div>
    </section>

    <!-- SEARCH view (fallback) -->
    <section id="view-search" class="view">
      <h1 class="page-title serif">검색 결과</h1>
      <div id="search-list" class="card-list"></div>
    </section>

  </main>


  <!-- FAB (create button) -->
  <button id="fab-create" title="새로 만들기">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <div class="toast" id="toast"></div>

  <script src="markdown-renderer.js"></script>
  <script src="app.js"></script>
</body>
</html>
